{% extends "base.html" %}
{% block title %}Question Bank — GCSE Citizenship{% endblock %}

{% block content %}
<div class="page-admin">
  <h1>Question Bank</h1>

  <div class="bank-filters">
    <select id="filter-topic" onchange="loadBank()">
      <option value="">All topics</option>
      {% for key, info in topics.items() %}
      <option value="{{ key }}">{{ info.label }}</option>
      {% endfor %}
    </select>
    <label>
      <input type="checkbox" id="filter-inactive" onchange="loadBank()">
      Show inactive
    </label>
    <span id="bank-count" class="bank-count"></span>
  </div>

  <div id="bank-table-wrap">Loading...</div>
</div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>
loadBank();
</script>
{% endblock %}
